server:
  port: 8080

spring:
  application:
    name: api
  config:
    # 秘密情報は backend/.env（.gitignore 対象）から読み込む。テンプレートは .env.example
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # スキーマは Flyway が管理、Hibernate は検証のみ
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
