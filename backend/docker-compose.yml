services:
  db:
    image: postgres:17
    container_name: taskboard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - taskboard-db-data:/var/lib/postgresql/data

volumes:
  taskboard-db-data:
